<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050510">
    <title>J.A.R.V.I.S API Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="monitor-body">
    <div class="monitor-app">
        <header class="monitor-header glass-panel">
            <div class="monitor-title-wrap">
                <h1 class="monitor-title">API Key Monitor</h1>
                <p class="monitor-subtitle">Live usage across all configured accounts</p>
            </div>
            <div class="monitor-head-right">
                <div class="status-badge" id="monitor-status">
                    <span class="status-dot"></span>
                    <span class="status-text" id="monitor-status-text">Live</span>
                </div>
                <button class="btn-icon" id="monitor-refresh" title="Refresh now" aria-label="Refresh now">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"></path>
                        <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"></path>
                    </svg>
                </button>
            </div>
        </header>

        <main class="monitor-main">
            <section class="monitor-summary glass-panel" id="monitor-summary"></section>
            <section class="monitor-grid" id="monitor-grid"></section>
            <section class="monitor-events glass-panel">
                <div class="monitor-events-header">
                    <h2>Recent activity</h2>
                </div>
                <div class="monitor-events-list" id="monitor-events-list">
                    <div class="activity-empty">No events yet. Send a message in Jarvis.</div>
                </div>
            </section>
        </main>
    </div>
    <script src="api-monitor.js"></script>
</body>

</html>
