<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.A.R.V.I.S — Viewer</title>
    <meta name="description" content="Standalone viewer for images and text produced by J.A.R.V.I.S.">
    <meta name="theme-color" content="#050510">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        /* ---------------------------------------------------------------
         * Chat design tokens.  [M14 P11.2]
         *
         * THIS IS A COPY of the values in web/css/tokens.css. Keep the two in
         * sync by hand -- and yes, that is deliberate. This page is opened
         * standalone, sometimes from a bookmark, sometimes with the app not
         * running at all, so it must not depend on a stylesheet it might not
         * be able to fetch. A copy with a pointer beats a shared file that
         * turns a standalone page blank.
         *
         * It already used --accent: #7c6aef, the chat accent, so matching the
         * chat was always the intent; --bg, the text ramp and the font just
         * never followed. Three visual dialects across five surfaces was an
         * accident. Two -- ambient chat, dense admin -- is a decision.
         *
         * --surface, --border and --accent-hover are local names this page
         * uses throughout; they now resolve to the chat equivalents rather
         * than to a third palette.
         * --------------------------------------------------------------- */
        :root {
            color-scheme: dark;
            --bg: #050510;
            --surface: rgba(10, 10, 28, 0.72);   /* = --glass-bg   */
            --border: rgba(255, 255, 255, 0.06); /* = --glass-border */
            --text: rgba(255, 255, 255, 0.93);
            --text-dim: rgba(255, 255, 255, 0.50);
            --accent: #7c6aef;
            --accent-hover: #6b5ce7;
            --accent-secondary: #4ecdc4;
            --success: #4ecdc4;
            --danger: #ff6b6b;
            --font: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            --radius: 16px;
            --radius-xs: 6px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        .topbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            background: rgba(18, 18, 42, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .topbar-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dim);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .topbar-actions { display: flex; gap: 8px; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.05);
            color: var(--text-dim);
            font-family: var(--font);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: transparent;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn svg { width: 16px; height: 16px; }
        .viewer-main {
            flex: 1;
            width: 100%;
            max-width: 960px;
            padding: 32px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            overflow-y: auto;
            min-height: 0;
        }
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 60px 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(124, 106, 239, 0.15);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text {
            font-size: 0.9rem;
            color: var(--text-dim);
        }
        .loading-prompt {
            font-size: 0.82rem;
            color: var(--text-dim);
            opacity: 0.7;
            max-width: 500px;
            text-align: center;
            line-height: 1.5;
        }
        .error-msg {
            padding: 20px 28px;
            background: rgba(255, 107, 107, 0.08);
            border: 1px solid rgba(255, 107, 107, 0.15);
            border-radius: var(--radius);
            color: var(--danger);
            font-size: 0.85rem;
            text-align: center;
        }
        .image-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .image-frame {
            width: 100%;
            max-width: 820px;
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: 0 8px 40px rgba(0,0,0,0.3);
        }
        .image-frame img {
            width: 100%;
            height: auto;
            display: block;
        }
        .image-prompt {
            font-size: 0.82rem;
            color: var(--text-dim);
            text-align: center;
            padding: 0 16px;
            max-width: 600px;
            line-height: 1.5;
        }
        .content-container {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .content-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .content-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .content-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .content-prompt {
            font-size: 0.8rem;
            color: var(--text-dim);
            opacity: 0.7;
        }
        .content-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .content-editor-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .content-editor {
            width: 100%;
            flex: 1;
            min-height: 55vh;
            padding: 24px 28px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--font);
            font-size: 0.92rem;
            line-height: 1.8;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .content-editor:focus {
            border-color: rgba(124, 106, 239, 0.35);
            box-shadow: 0 0 0 3px rgba(124, 106, 239, 0.08);
        }
        .content-editor::-webkit-scrollbar { display: none; }
        .content-editor { -ms-overflow-style: none; scrollbar-width: none; }
        .content-editor::placeholder {
            color: var(--text-dim);
            opacity: 0.5;
        }
        .content-wordcount {
            font-size: 0.7rem;
            color: var(--text-dim);
            opacity: 0.6;
            text-align: right;
            padding-top: 6px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-image {
            background: rgba(124, 106, 239, 0.12);
            color: var(--accent);
            border: 1px solid rgba(124, 106, 239, 0.15);
        }
        .badge-content {
            background: rgba(78, 205, 196, 0.1);
            color: var(--success);
            border: 1px solid rgba(78, 205, 196, 0.15);
        }
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            padding: 10px 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 0.82rem;
            z-index: 100;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        @media (max-width: 768px) {
            .topbar { padding: 12px 16px; }
            .viewer-main { padding: 20px 16px; max-width: 100%; }
            .btn { padding: 7px 14px; font-size: 0.75rem; }
            .content-editor { padding: 20px; font-size: 0.86rem; min-height: 45vh; }
            .content-header { flex-direction: column; align-items: flex-start; }
        }
        @media (max-width: 480px) {
            .topbar { padding: 10px 12px; }
            .topbar-actions { gap: 4px; }
            .viewer-main { padding: 14px 10px; }
            .topbar-title { font-size: 0.75rem; }
            .btn { padding: 6px 10px; font-size: 0.7rem; }
            .content-editor { padding: 16px; font-size: 0.82rem; min-height: 40vh; line-height: 1.7; }
            .image-frame { border-radius: 10px; }
        }
        /* -----------------------------------------------------------------
         * Motion and contrast.  [M14 P11.5]
         * P2 covered the chat app only. The spinner here loops forever, which
         * is exactly the kind of thing reduced-motion exists for.
         * ----------------------------------------------------------------- */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                scroll-behavior: auto !important;
            }
        }

        @media (prefers-contrast: more) {
            :root {
                --text-dim: rgba(255, 255, 255, 0.78);
                --border: rgba(255, 255, 255, 0.28);
                --surface: #12122a;
            }

            .topbar {
                backdrop-filter: none;
            }
        }

        /* -----------------------------------------------------------------
         * Cross-surface navigation.  [M14 P11.6]
         * Inline rather than shared, for the same reason the tokens are.
         * ----------------------------------------------------------------- */
        .surface-nav {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
            font-size: 0.76rem;
        }

        .surface-nav a {
            padding: 5px 10px;
            border-radius: var(--radius-xs);
            border: 1px solid transparent;
            color: var(--text-dim);
            text-decoration: none;
            white-space: nowrap;
            transition: var(--transition);
        }

        .surface-nav a:hover {
            color: var(--text);
            border-color: var(--border);
        }

        .surface-nav a:focus-visible,
        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* -----------------------------------------------------------------
         * Empty state.  [M14 P11.3]
         * What this page shows when it was opened with nothing to show. It
         * used to show a spinner and then claim the task timed out.
         * ----------------------------------------------------------------- */
        .viewer-empty {
            max-width: 520px;
            padding: 48px 20px;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.88rem;
            line-height: 1.65;
        }

        .viewer-empty h2 {
            margin-bottom: 10px;
            color: var(--text);
            font-size: 1rem;
            font-weight: 600;
        }

        .viewer-empty code {
            padding: 2px 6px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.06);
            font-family: ui-monospace, 'Cascadia Code', 'Consolas', monospace;
            font-size: 0.82em;
            color: var(--accent-secondary);
        }

    </style>
</head>
<body>
    <div class="topbar">
        <span class="topbar-title">J.A.R.V.I.S</span>
        <nav class="surface-nav" aria-label="J.A.R.V.I.S surfaces">
            <a href="/jarvis/">Chat</a>
            <a href="/dashboard">Control Center</a>
            <a href="/watcher">Watcher</a>
            <a href="/jarvis/api-monitor.html">API Monitor</a>
        </nav>
        <div class="topbar-actions" id="topbar-actions"></div>
    </div>

    <div class="viewer-main" id="viewer-main">
        <div class="loading" id="loading-state">
            <div class="spinner"></div>
            <div class="loading-text">Working on it...</div>
            <div class="loading-prompt" id="loading-prompt"></div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script>
    (function() {
        /* -------------------------------------------------------------------
         * How this page gets its content.  [M14 P11.3]
         *
         * It used to poll GET /tasks/{task_id} once a second, up to 120 times.
         * That route does not exist and has not for a long time -- the
         * background-task system it belonged to was removed in the agent
         * rebuild, and results now arrive inline in the chat through
         * _actions -> handleActions(). So every visit produced two minutes of
         * 404s behind a spinner, then "Task timed out. Please try again",
         * which was not true and could not be fixed by trying again.
         *
         * A dead route is not replaced with a new one here on purpose: the
         * backend genuinely has nothing to serve. Instead the page takes its
         * content from the two places a standalone viewer can honestly get it.
         *
         *   1. Query parameters -- shareable, bookmarkable, no backend:
         *        viewer.html?image=<https url>&prompt=<optional caption>
         *        viewer.html?text=<url-encoded text>&prompt=<optional>
         *   2. postMessage from the window that opened it, same origin only:
         *        win.postMessage({ type: 'jarvis:viewer',
         *                          result: { type: 'image', url, prompt } }, origin)
         *
         * With neither, it says so plainly instead of pretending to load.
         * ----------------------------------------------------------------- */
        const params = new URLSearchParams(window.location.search);
        const mainEl = document.getElementById('viewer-main');
        const loadingEl = document.getElementById('loading-state');
        const actionsEl = document.getElementById('topbar-actions');
        const toastEl = document.getElementById('toast');

        // Nothing polls any more, so the spinner has no job at boot. It stays
        // in the markup for postMessage senders that want to show it while
        // they prepare a result.
        loadingEl.style.display = 'none';

        let emptyEl = null;

        function resultFromParams(p) {
            const image = p.get('image');
            // Same guard the chat uses on remote images: an attacker-supplied
            // javascript: or data: URL must never reach an src attribute.
            if (image && /^https?:\/\//i.test(image)) {
                return { type: 'image', url: image, prompt: p.get('prompt') || '' };
            }
            const text = p.get('text') !== null ? p.get('text') : p.get('content');
            if (text !== null) {
                return { type: 'content', text: text, prompt: p.get('prompt') || '' };
            }
            return null;
        }

        function clearEmptyState() {
            if (emptyEl && emptyEl.parentNode) emptyEl.parentNode.removeChild(emptyEl);
            emptyEl = null;
        }

        function showEmptyState() {
            clearEmptyState();
            emptyEl = document.createElement('div');
            emptyEl.className = 'viewer-empty';
            const h = document.createElement('h2');
            h.textContent = 'Nothing to show yet';
            const p1 = document.createElement('p');
            p1.textContent = 'This viewer displays an image or a block of text that '
                + 'J.A.R.V.I.S produced. Open it with something to show:';
            const p2 = document.createElement('p');
            p2.style.marginTop = '12px';
            const c1 = document.createElement('code');
            c1.textContent = 'viewer.html?image=<url>';
            const c2 = document.createElement('code');
            c2.textContent = 'viewer.html?text=<text>';
            p2.appendChild(c1);
            p2.appendChild(document.createTextNode('  or  '));
            p2.appendChild(c2);
            const p3 = document.createElement('p');
            p3.style.marginTop = '12px';
            p3.textContent = 'Generated images and content also appear directly in the '
                + 'chat, which is usually where you want them.';
            emptyEl.appendChild(h);
            emptyEl.appendChild(p1);
            emptyEl.appendChild(p2);
            emptyEl.appendChild(p3);
            mainEl.appendChild(emptyEl);
            actionsEl.textContent = '';
            const back = document.createElement('a');
            back.className = 'btn';
            back.href = '/jarvis/';
            back.textContent = 'Open chat';
            actionsEl.appendChild(back);
        }

        window.addEventListener('message', function (event) {
            // Same-origin only. A viewer that renders whatever any page sends it
            // is an XSS hole with a nice spinner.
            if (event.origin !== window.location.origin) return;
            const data = event.data;
            if (!data || data.type !== 'jarvis:viewer' || !data.result) return;
            clearEmptyState();
            renderResult({ result: data.result });
        });

        const initial = resultFromParams(params);
        if (initial) {
            renderResult({ result: initial });
        } else {
            showEmptyState();
        }
        function renderResult(data) {
            const result = data.result;
            if (!result) {
                showError('No result data received.');
                return;
            }

            loadingEl.style.display = 'none';

            if (result.type === 'image') {
                renderImage(result);
            } else if (result.type === 'content') {
                renderContent(result);
            } else {
                showError('Unknown result type: ' + result.type);
            }
        }
        function renderImage(result) {
            document.title = 'J.A.R.V.I.S — Generated Image';
            const badge = document.createElement('span');
            badge.className = 'badge badge-image';
            badge.textContent = 'Generated Image';
            const container = document.createElement('div');
            container.className = 'image-container';
            const frame = document.createElement('div');
            frame.className = 'image-frame';
            const img = document.createElement('img');
            img.referrerPolicy = 'no-referrer';
            img.src = result.url;
            img.alt = result.prompt || 'Generated image';
            img.onerror = () => showError('Failed to load image. The URL may have expired.');
            frame.appendChild(img);
            container.appendChild(badge);
            container.appendChild(frame);
            if (result.prompt) {
                const prompt = document.createElement('div');
                prompt.className = 'image-prompt';
                prompt.textContent = `Prompt: "${result.prompt}"`;
                container.appendChild(prompt);
            }
            mainEl.appendChild(container);
            actionsEl.innerHTML = '';
            const downloadBtn = createBtn('Download', downloadSvg(), () => downloadImage(result.url, result.prompt));
            actionsEl.appendChild(downloadBtn);
            const copyUrlBtn = createBtn('Copy URL', copySvg(), () => {
                navigator.clipboard.writeText(result.url).then(() => showToast('URL copied!'));
            });
            actionsEl.appendChild(copyUrlBtn);
        }
        function renderContent(result) {
            document.title = 'J.A.R.V.I.S — Generated Content';
            const container = document.createElement('div');
            container.className = 'content-container';
            const header = document.createElement('div');
            header.className = 'content-header';
            const meta = document.createElement('div');
            meta.className = 'content-meta';
            const badge = document.createElement('span');
            badge.className = 'badge badge-content';
            badge.textContent = 'Generated Content';
            meta.appendChild(badge);
            if (result.prompt) {
                const prompt = document.createElement('div');
                prompt.className = 'content-prompt';
                prompt.textContent = `Prompt: "${result.prompt}"`;
                meta.appendChild(prompt);
            }
            header.appendChild(meta);
            const actions = document.createElement('div');
            actions.className = 'content-actions';
            const copyBtn = createBtn('Copy', copySvg(), () => {
                navigator.clipboard.writeText(editor.value).then(() => showToast('Content copied!'));
            });
            actions.appendChild(copyBtn);
            const downloadTxtBtn = createBtn('Download .txt', downloadSvg(), () => {
                downloadText(editor.value, 'jarvis-content.txt');
            });
            actions.appendChild(downloadTxtBtn);
            const downloadMdBtn = createBtn('Download .md', downloadSvg(), () => {
                downloadText(editor.value, 'jarvis-content.md');
            });
            actions.appendChild(downloadMdBtn);
            header.appendChild(actions);
            container.appendChild(header);
            const editorWrap = document.createElement('div');
            editorWrap.className = 'content-editor-wrap';
            const editor = document.createElement('textarea');
            editor.className = 'content-editor';
            editor.value = result.text || '';
            editor.spellcheck = true;
            editor.placeholder = 'Your content will appear here...';
            editorWrap.appendChild(editor);
            const wordcount = document.createElement('div');
            wordcount.className = 'content-wordcount';
            function updateWordCount() {
                const words = editor.value.trim().split(/\s+/).filter(Boolean).length;
                const chars = editor.value.length;
                wordcount.textContent = words + ' words / ' + chars + ' characters';
            }
            updateWordCount();
            editor.addEventListener('input', updateWordCount);
            editorWrap.appendChild(wordcount);
            container.appendChild(editorWrap);
            mainEl.appendChild(container);
            actionsEl.innerHTML = '';
            const topCopyBtn = createBtn('Copy All', copySvg(), () => {
                navigator.clipboard.writeText(editor.value).then(() => showToast('Copied!'));
            });
            topCopyBtn.classList.add('btn-primary');
            actionsEl.appendChild(topCopyBtn);
        }
        function createBtn(text, svgHtml, onClick) {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerHTML = svgHtml + ' ' + text;
            btn.addEventListener('click', onClick);
            return btn;
        }
        function showError(msg) {
            loadingEl.style.display = 'none';
            const el = document.createElement('div');
            el.className = 'error-msg';
            el.textContent = msg;
            mainEl.appendChild(el);
        }
        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            setTimeout(() => toastEl.classList.remove('show'), 2000);
        }
        function downloadImage(url, prompt) {
            fetch(url)
                .then(r => r.blob())
                .then(blob => {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = (prompt || 'jarvis-image').replace(/[^a-z0-9 ]/gi, '').trim().replace(/\s+/g, '-').substring(0, 50) + '.png';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(a.href);
                    showToast('Download started!');
                })
                .catch(() => {
                    window.open(url, '_blank');
                    showToast('Opened image in new tab (download blocked by CORS)');
                });
        }
        function downloadText(text, filename) {
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
            showToast('Download started!');
        }
        function downloadSvg() {
            return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
        }
        function copySvg() {
            return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
        }
    })();
    </script>
